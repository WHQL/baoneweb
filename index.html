<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来科技 - 探索无限可能</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --primary-blue: #3b82f6;
            --accent-cyan: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 动态背景背景光晕 */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            z-index: -1;
        }

        .glow-spot {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-blue);
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        /* Hero 主视觉区 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-dim);
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            padding: 1rem 2.5rem;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
            background: #2563eb;
        }

        /* 特性展示区 */
        .features {
            padding: 100px 10%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-blue);
            background: rgba(15, 23, 42, 0.8);
        }

        .card h3 {
            margin: 1rem 0;
            color: var(--accent-cyan);
        }

        .card p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        /* 页脚 */
        footer {
            padding: 50px 10%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-spot" style="top: 10%; left: 10%;"></div>
        <div class="glow-spot" style="bottom: 10%; right: 10%; background: var(--accent-cyan);"></div>
    </div>

    <nav>
        <div class="logo">TECH NOVA</div>
        <ul class="nav-links">
            <li><a href="#">首页</a></li>
            <li><a href="#">核心技术</a></li>
            <li><a href="#">解决方案</a></li>
            <li><a href="#">关于我们</a></li>
        </ul>
        <button class="btn-primary" style="padding: 0.5rem 1.5rem; font-size: 0.8rem;">开启咨询</button>
    </nav>

    <section class="hero">
        <h1>引领数字化转型的未来</h1>
        <p>利用尖端人工智能与云计算技术，为企业提供下一代高效能技术方案。突破边界，定义可能。</p>
        <div class="hero-btns">
            <button class="btn-primary">立即开始</button>
        </div>
    </section>

    <section class="features">
        <div class="card">
            <div class="card-icon">⚡</div>
            <h3>量子计算架构</h3>
            <p>基于分布式量子节点，提供超越传统算力千倍的实时数据处理能力。</p>
        </div>
        <div class="card">
            <div class="card-icon">🛡️</div>
            <h3>加密安全盾</h3>
            <p>零信任安全模型与多态加密算法，全方位守护您的核心资产与业务数据。</p>
        </div>
        <div class="card">
            <div class="card-icon">🧠</div>
            <h3>深度神经网络</h3>
            <p>自研大规模预训练模型，深度契合各垂直行业应用场景，赋能智能决策。</p>
        </div>
    </section>

    <footer>
        <p>© 2025 Tech Nova 未来科技集团. All rights reserved.</p>
    </footer>

</body>
</html>
